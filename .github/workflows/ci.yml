name: CI

on:
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test -- --run --coverage

      - name: Build
        run: npm run build

  # End-to-end walkthrough (e2e/): drive the real app against a mocked Supabase
  # and both screenshot every screen and assert each action's Supabase call. No
  # backend and no secrets — every request is intercepted (see e2e/fixtures.ts).
  # This is a view/wiring harness; authorisation stays with the rls-policies job.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run e2e
        run: npm run test:e2e

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screens
          path: e2e/__screens__/
          if-no-files-found: ignore

  # RLS policy tests (spec 9.8): run the pgTAP suite in supabase/tests against a
  # throwaway local instance, never against the development environment. The
  # matrix in spec 4.2 is the specification — "a policy without a test counts as
  # absent" (spec 9.5).
  rls-policies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase (applies migrations and seed)
        run: supabase start

      - name: Run RLS policy tests
        run: supabase test db

      - name: Stop Supabase
        if: always()
        run: supabase stop